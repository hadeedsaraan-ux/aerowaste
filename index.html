<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroWaste — The Living Scene</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="visual-body">

  <!-- Ambient Cinematic Frame -->
  <div class="scene-wrapper">

    <!-- Top Status Overlay (Minimalist) -->
    <header class="scene-header">
      <div class="status-pill">
        <span class="blinking-dot"></span>
        <span id="char-state-label">HUMAN STATUS: STRUGGLING TO BREATHE (COUGHING)</span>
      </div>
      <div class="status-metrics">
        <span>OXYGEN LUNG CAPACITY: <strong id="oxygen-stat" class="danger">14%</strong></span>
        <span>STREET DEBRIS: <strong id="debris-stat">3 ITEMS</strong></span>
      </div>
    </header>

    <!-- The Visual Animated World Canvas -->
    <div class="canvas-viewport">
      <canvas id="worldCanvas" width="1100" height="550"></canvas>
      
      <!-- Interactive Hint on Ground -->
      <div class="click-hint" id="click-hint">
        &#128070; Click on any plastic waste on the road to send the human to pick it up
      </div>
    </div>

    <!-- Director's Controls (To help you test & polish) -->
    <footer class="director-toolbar">
      <button id="btn-spawn-trash" class="tool-btn">+ Drop More Waste on Road</button>
      <button id="btn-toggle-smog" class="tool-btn">Toggle Heavy Smog</button>
      <button id="btn-reset-scene" class="tool-btn">Reset Character Position</button>
    </footer>

  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
